name: Publish npm

permissions:
  contents: read
  id-token: write

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: Publish @wingman/schema and @wingman/sdk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wingman/schema build
      - run: pnpm --filter @wingman/sdk build
      - run: pnpm package:check
      - run: pnpm --filter @wingman/schema publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: pnpm --filter @wingman/sdk publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
